<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>Party Music Pro | Ultra Slim</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --accent: #ff2d55;
            --bg: #030303;
            --glass: rgba(255, 255, 255, 0.04);
            --border: rgba(255, 255, 255, 0.08);
            --text: #ffffff;
            --text-dim: #929292;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; display: flex; flex-direction: column; }

        /* SCROLL PRINCIPAL */
        .main-scroll { flex: 1; overflow-y: auto; padding: 15px; padding-bottom: 140px; scrollbar-width: none; }
        .main-scroll::-webkit-scrollbar { display: none; }

        /* HERO SLIDER REDUCIDO */
        .hero { width: 100%; height: 180px; border-radius: 20px; overflow: hidden; position: relative; margin-bottom: 25px; border: 1px solid var(--border); }
        .slide { position: absolute; width: 100%; height: 100%; opacity: 0; transition: 1s; background-size: cover; background-position: center; }
        .slide.active { opacity: 1; }
        .slide-content { width: 100%; height: 100%; background: linear-gradient(to top, rgba(0,0,0,0.7), transparent); display: flex; align-items: flex-end; padding: 15px; }
        .slide-content h2 { font-size: 22px; font-weight: 800; }

        /* SECCIONES Y CARRUSELES */
        .section { margin-bottom: 25px; }
        .section-title { font-size: 16px; font-weight: 800; margin-bottom: 12px; color: var(--accent); text-transform: uppercase; letter-spacing: 1px; }
        
        /* Contenedor del Carrusel */
        .row-container { 
            display: flex; 
            overflow-x: auto; 
            gap: 12px; /* Espacio uniforme */
            padding: 5px 0; 
            scroll-snap-type: x mandatory; 
        }
        .row-container::-webkit-scrollbar { display: none; }

        /* TARJETA MINI (Respetando tamaño único) */
        .song-card {
            flex: 0 0 130px; /* Tamaño fijo para todas */
            scroll-snap-align: start;
            background: var(--glass);
            border: 1px solid var(--border);
            padding: 8px;
            border-radius: 16px;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            flex-direction: column;
            height: fit-content; /* Elimina el bloque largo debajo */
        }
        .song-card img { width: 100%; aspect-ratio: 1; border-radius: 12px; object-fit: cover; margin-bottom: 6px; }
        .song-card b { display: block; font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 2px; }
        .song-card span { font-size: 9px; color: var(--text-dim); }

        /* REPRODUCTOR PROFESIONAL BLINDADO */
        .floating-player {
            position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%);
            width: 95%; max-width: 800px; height: 75px;
            background: rgba(10, 10, 10, 0.85); backdrop-filter: blur(25px);
            border: 1px solid var(--border); border-radius: 20px;
            display: flex; align-items: center; padding: 0 15px; z-index: 1000;
        }

        #waves { position: absolute; left: 0; bottom: 0; width: 100%; height: 100%; z-index: 0; opacity: 0.3; border-radius: 20px; }

        /* Info de canción - No pisa los botones */
        .track-display { 
            width: 45%; 
            display: flex; 
            align-items: center; 
            gap: 10px; 
            z-index: 2; 
            overflow: hidden; /* Importante */
        }
        .track-display img { width: 42px; height: 42px; border-radius: 8px; flex-shrink: 0; }
        .track-meta { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
        .track-meta b { display: block; font-size: 12px; overflow: hidden; text-overflow: ellipsis; width: 100%; }
        .track-meta span { font-size: 9px; color: var(--text-dim); }

        /* Controles - Espacio garantizado */
        .main-controls { 
            flex: 1; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center;
            z-index: 2; 
            min-width: 140px; /* Evita que el texto los empuje */
        }
        .control-btns { display: flex; align-items: center; gap: 15px; }
        .state-btn { font-size: 12px; cursor: pointer; color: var(--text-dim); }
        .state-btn.active { color: var(--accent); text-shadow: 0 0 8px var(--accent); }
        .play-main-btn { width: 38px; height: 38px; background: #fff; color: #000; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 16px; cursor: pointer; }

        /* Barra de tiempo compacta */
        .timeline-box { width: 90%; display: flex; align-items: center; gap: 8px; font-size: 8px; color: var(--text-dim); margin-top: 5px; }
        .timeline-rail { flex: 1; height: 3px; background: rgba(255,255,255,0.1); border-radius: 10px; }
        .timeline-fill { height: 100%; background: var(--accent); border-radius: 10px; width: 0%; }

        /* AJUSTES MÓVIL EXTREMOS */
        @media (max-width: 768px) {
            .hero { height: 140px; margin-bottom: 20px; }
            .section-title { font-size: 14px; }
            .song-card { flex: 0 0 120px; padding: 6px; } /* Más pequeño y fino */
            
            .floating-player { height: 70px; padding: 0 10px; }
            .track-display { width: 50%; } /* Texto ocupa la mitad */
            .main-controls { width: 50%; align-items: flex-end; } /* Botones a la derecha */
            .control-btns { gap: 10px; }
            .control-btns .state-btn { font-size: 11px; }
            .timeline-box { position: absolute; bottom: 5px; left: 10px; width: calc(100% - 20px); }
        }
    </style>
</head>
<body>
    <main class="main-scroll">
        <div class="hero">
            <div class="slide active" style="background-image: url('https://images.unsplash.com/photo-1470225620780-dba8ba36b745?w=600')"><div class="slide-content"><h2>TOP PARTY</h2></div></div>
            <div class="slide" style="background-image: url('https://images.unsplash.com/photo-1493225255756-d9584f8606e9?w=600')"><div class="slide-content"><h2>NUEVOS HITS</h2></div></div>
        </div>
        <div id="app-body"></div>
    </main>

    <footer class="floating-player">
        <canvas id="waves"></canvas>
        <div class="track-display">
            <img src="https://i.scdn.co/image/ab67616d0000b2734190897f564771746401037f" id="player-art">
            <div class="track-meta">
                <b id="player-t">No Se Ve</b>
                <span id="player-a">Emilia, Ludmilla</span>
            </div>
        </div>
        <div class="main-controls">
            <div class="control-btns">
                <span id="shuffle-btn" class="state-btn" onclick="toggleShuffle()">🔀</span>
                <span onclick="prev()" style="cursor:pointer; font-size:16px;">⏮</span>
                <div class="play-main-btn" id="play-btn" onclick="toggle()">▶</div>
                <span onclick="next()" style="cursor:pointer; font-size:16px;">⏭</span>
                <span id="loop-btn" class="state-btn" onclick="toggleLoop()">🔁</span>
            </div>
            <div class="timeline-box">
                <span id="time-c">0:00</span>
                <div class="timeline-rail" onclick="seek(event)"><div class="timeline-fill" id="fill"></div></div>
                <span id="time-t">0:00</span>
            </div>
        </div>
    </footer>

    <audio id="audio" crossorigin="anonymous"></audio>

<script>
    const audio = document.getElementById('audio');
    let tracks = [], current = 0, isShuffle = false, isLoop = false;
    let audioCtx, analyser, canvas, ctx, dataArray;

    const demo = {
        t: "No Se Ve (Official Video)", a: "Emilia, Ludmilla, Zecca",
        img: "https://i.scdn.co/image/ab67616d0000b2734190897f564771746401037f",
        file: "https://vidcache.net:8161/static/40538fae3f062419419efb3a65e092d82f731e9c/Emilia,%20Ludmilla,%20Zecca%20-%20No_se_ve.mp3%20(Official%20Video).mp3",
        type: "VIRAL HOY"
    };

    async function load() {
        try {
            const res = await fetch('datos.json');
            tracks = await res.json();
            if(!tracks.length) tracks = [demo];
        } catch(e) { tracks = [demo]; }
        render();
    }

    function render() {
        const body = document.getElementById('app-body');
        const groups = tracks.reduce((acc, t) => { acc[t.type] = acc[t.type] || []; acc[t.type].push(t); return acc; }, {});
        for (const type in groups) {
            const sec = document.createElement('div');
            sec.className = 'section';
            sec.innerHTML = `<h3 class="section-title">${type}</h3><div class="row-container">${groups[type].map(t => `
                <div class="song-card" onclick="playSong(${tracks.indexOf(t)})"><img src="${t.img}"><b>${t.t}</b><span>${t.a}</span></div>`).join('')}</div>`;
            body.appendChild(sec);
        }
    }

    function toggleShuffle() { isShuffle = !isShuffle; document.getElementById('shuffle-btn').classList.toggle('active', isShuffle); }
    function toggleLoop() { isLoop = !isLoop; audio.loop = isLoop; document.getElementById('loop-btn').classList.toggle('active', isLoop); }

    function playSong(i) {
        if (!audioCtx) initVisualizer();
        current = i; const s = tracks[i];
        document.getElementById('player-art').src = s.img;
        document.getElementById('player-t').innerText = s.t;
        document.getElementById('player-a').innerText = s.a;
        audio.src = s.file; audio.play();
        document.getElementById('play-btn').innerText = '⏸';
    }

    function next() { isShuffle ? playSong(Math.floor(Math.random()*tracks.length)) : playSong((current+1)%tracks.length); }
    function prev() { playSong((current-1+tracks.length)%tracks.length); }
    function toggle() { if(!audio.src) return playSong(0); if(audioCtx) audioCtx.resume(); audio.paused ? (audio.play(), document.getElementById('play-btn').innerText = '⏸') : (audio.pause(), document.getElementById('play-btn').innerText = '▶'); }

    audio.onended = () => { if(!isLoop) next(); };
    audio.ontimeupdate = () => {
        const pct = (audio.currentTime/audio.duration)*100 || 0;
        document.getElementById('fill').style.width = pct + "%";
        const fmt = (s) => { const m=Math.floor(s/60), sc=Math.floor(s%60); return `${m}:${sc<10?'0'+sc:sc}`; };
        document.getElementById('time-c').innerText = fmt(audio.currentTime);
        if(audio.duration) document.getElementById('time-t').innerText = fmt(audio.duration);
    };

    function seek(e) { audio.currentTime = (e.offsetX / e.currentTarget.offsetWidth) * audio.duration; }

    function initVisualizer() {
        canvas = document.getElementById("waves"); ctx = canvas.getContext("2d");
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        analyser = audioCtx.createAnalyser();
        const src = audioCtx.createMediaElementSource(audio);
        src.connect(analyser); analyser.connect(audioCtx.destination);
        analyser.fftSize = 64; dataArray = new Uint8Array(analyser.frequencyBinCount);
        function draw() {
            requestAnimationFrame(draw); canvas.width = canvas.offsetWidth; canvas.height = canvas.offsetHeight;
            analyser.getByteFrequencyData(dataArray); ctx.clearRect(0, 0, canvas.width, canvas.height);
            let barW = (canvas.width / dataArray.length) * 2; let x = 0;
            for(let i=0; i<dataArray.length; i++) {
                let h = dataArray[i]/4; ctx.fillStyle = `rgba(255, 45, 85, ${h/50})`;
                ctx.fillRect(x, canvas.height-h, barW, h); x += barW + 2;
            }
        }
        draw();
    }

    setInterval(() => {
        const slides = document.querySelectorAll('.slide');
        if(slides.length) {
            let active = document.querySelector('.slide.active');
            active.classList.remove('active');
            let next = active.nextElementSibling || slides[0];
            next.classList.add('active');
        }
    }, 5000);

    load();
</script>
</body>
</html>
