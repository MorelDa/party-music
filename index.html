<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>Music Pro Ultra</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --spotify-green: #1DB954;
            --bg: #000000;
            --surface: #121212;
            --text: #ffffff;
            --text-dim: #b3b3b3;
            --border: rgba(255, 255, 255, 0.1);
            --card-w: 140px; /* Tamaño fijo de la tarjeta */
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: var(--text); height: 100dvh; overflow: hidden; display: flex; flex-direction: column; }

        /* --- HOME / WEB PRINCIPAL --- */
        .main-scroll { flex: 1; overflow-y: auto; padding-bottom: 120px; scrollbar-width: none; }
        .main-scroll::-webkit-scrollbar { display: none; }

        .hero-container { padding: 16px; max-width: 1200px; margin: 0 auto; width: 100%; }
        .hero { 
            width: 100%; height: 180px; border-radius: 12px; overflow: hidden; position: relative; 
            background: #1a1a1a; border: 1px solid var(--border);
        }
        .slide { position: absolute; width: 100%; height: 100%; opacity: 0; transition: 1s; background-size: cover; background-position: center; }
        .slide.active { opacity: 1; }

        .section { margin-top: 30px; max-width: 1200px; margin-left: auto; margin-right: auto; }
        .section-title { font-size: 20px; font-weight: 800; margin: 0 16px 15px 16px; color: #fff; }
        
        /* Carrusel Corregido para PC (Mouse wheel) y Móvil (Touch) */
        .row-container { 
            display: flex; 
            overflow-x: auto; 
            gap: 16px; 
            padding: 0 16px 20px 16px;
            scroll-snap-type: x mandatory;
            flex-wrap: nowrap;
            -webkit-overflow-scrolling: touch;
        }
        /* Barra de scroll sutil para PC para que sepa que puede deslizar */
        .row-container::-webkit-scrollbar { height: 4px; }
        .row-container::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }

        /* TARJETA CON TAMAÑO ESTRICTO */
        .song-card { 
            flex: 0 0 var(--card-w); 
            scroll-snap-align: start; 
            cursor: pointer;
            transition: transform 0.2s;
        }
        .song-card:hover { transform: translateY(-5px); }

        /* CUADRO 1:1 FORZADO POR CSS */
        .img-wrapper {
            width: var(--card-w);
            height: var(--card-w);
            border-radius: 8px;
            overflow: hidden;
            background: var(--surface);
            margin-bottom: 10px;
            flex-shrink: 0;
        }
        .song-card img { width: 100%; height: 100%; object-fit: cover !important; display: block; }

        /* Títulos: PROHIBIDO CRECER HACIA ABAJO */
        .song-card b { 
            display: block; 
            font-size: 13px; 
            font-weight: 600; 
            color: #fff;
            white-space: nowrap; /* Una sola línea */
            overflow: hidden; 
            text-overflow: ellipsis; /* Pone "..." si es largo */
        }
        .song-card span { 
            display: block;
            font-size: 11px; 
            color: var(--text-dim);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* --- REPRODUCTOR FULL SCREEN (REDISEÑADO PARA PC Y MÓVIL) --- */
        #fullscreen-player {
            position: fixed;
            top: 100%; left: 0; width: 100%; height: 100dvh;
            background: linear-gradient(to bottom, #403080 0%, #000 100%);
            z-index: 2000;
            transition: top 0.5s cubic-bezier(0.3, 0, 0.2, 1);
            display: flex; 
            flex-direction: column; 
            align-items: center;
            padding: 20px;
        }
        #fullscreen-player.active { top: 0; }

        /* Contenedor interno del reproductor para que no se vea cortado en PC */
        .player-center-content {
            width: 100%;
            max-width: 400px; /* Ancho ideal tipo móvil incluso en PC */
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .top-bar { display: flex; justify-content: space-between; align-items: center; width: 100%; }
        .top-bar span { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; }

        .artwork-nav { flex: 1; display: flex; align-items: center; justify-content: center; padding: 30px 0; }
        .artwork-nav img { 
            width: 100%; 
            max-width: 350px;
            aspect-ratio: 1/1; 
            border-radius: 8px; 
            box-shadow: 0 15px 50px rgba(0,0,0,0.7); 
            object-fit: cover; 
        }

        .track-info { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .track-info h1 { font-size: 24px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 280px; }
        .track-info p { color: var(--text-dim); font-size: 16px; }

        .progress-section { margin-bottom: 25px; }
        .progress-section input[type="range"] { width: 100%; accent-color: #fff; height: 4px; cursor: pointer; }
        .time-stamps { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-dim); margin-top: 10px; }

        .main-controls { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .play-pause-circle { 
            width: 70px; height: 70px; background: #fff; border-radius: 50%; 
            display: flex; justify-content: center; align-items: center; cursor: pointer;
        }

        .bottom-device-bar { display: flex; align-items: center; justify-content: space-between; padding-bottom: 20px; }
        .volume-wrapper { display: flex; align-items: center; gap: 10px; flex: 1; margin: 0 15px; }
        .volume-wrapper input { accent-color: var(--spotify-green); height: 4px; width: 100%; cursor: pointer; }
        
        @media (min-width: 1024px) {
            --card-w: 180px; /* Tarjetas un poco más grandes en PC */
            .hero { height: 250px; }
            .player-center-content { max-width: 450px; } /* Reproductor un poco más ancho en PC */
        }
    </style>
</head>
<body>

    <main class="main-scroll">
        <div class="hero-container">
            <div class="hero" id="hero-slider"></div>
        </div>
        <div id="app-body"></div>
    </main>

    <div id="fullscreen-player">
        <div class="player-center-content">
            <div class="top-bar">
                <svg onclick="closePlayer()" width="28" height="28" viewBox="0 0 24 24" fill="white" style="cursor:pointer"><path d="M12 16l-6-6h12z"/></svg>
                <span>Reproduciendo ahora</span>
                <svg width="24" height="24" viewBox="0 0 24 24" fill="white"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg>
            </div>

            <div class="artwork-nav">
                <img id="p-art" src="" alt="Cover">
            </div>

            <div class="track-info">
                <div>
                    <h1 id="p-title">Título de la Canción Muy Largo</h1>
                    <p id="p-artist">Nombre del Artista</p>
                </div>
                <svg width="28" height="28" viewBox="0 0 24 24" fill="#1DB954"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
            </div>

            <div class="progress-section">
                <input type="range" id="seekSlider" value="0" min="0" step="0.1">
                <div class="time-stamps">
                    <span id="curTime">0:00</span>
                    <span id="durTime">0:00</span>
                </div>
            </div>

            <div class="main-controls">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="#b3b3b3"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg>
                <svg onclick="prev()" width="35" height="35" viewBox="0 0 24 24" fill="white" style="cursor:pointer"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
                
                <div class="play-pause-circle" id="playBtn">
                    <svg id="playIcon" width="32" height="32" viewBox="0 0 24 24" fill="black"><path d="M8 5v14l11-7z"/></svg>
                </div>

                <svg onclick="next()" width="35" height="35" viewBox="0 0 24 24" fill="white" style="cursor:pointer"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
                <svg width="24" height="24" viewBox="0 0 24 24" fill="#b3b3b3"><path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/></svg>
            </div>

            <div class="bottom-device-bar">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="#1DB954"><path d="M12 3L1 9h22L12 3zM3 11v8c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2v-8H3z"/></svg>
                <div class="volume-wrapper">
                    <input type="range" id="volumeSlider" value="80" min="0" max="100">
                </div>
                <svg width="20" height="20" viewBox="0 0 24 24" fill="#b3b3b3"><path d="M15 15H3v2h12v-2zm0-8H3v2h12V7zM3 13h18v-2H3v2zm0 8h18v-2H3v2zM3 3v2h18V3H3z"/></svg>
            </div>
        </div>
    </div>

    <audio id="audio" crossorigin="anonymous"></audio>

<script>
    const audio = document.getElementById('audio');
    const playerView = document.getElementById('fullscreen-player');
    const playIcon = document.getElementById('playIcon');
    let tracks = [], current = 0;

    async function load() {
        try {
            const res = await fetch('datos.json');
            tracks = await res.json();
            render();
            initHero();
        } catch(e) { console.error("Error cargando JSON"); }
    }

    function render() {
        const body = document.getElementById('app-body');
        const groups = tracks.reduce((acc, t) => { acc[t.type] = acc[t.type] || []; acc[t.type].push(t); return acc; }, {});
        body.innerHTML = "";
        
        for (const type in groups) {
            const sec = document.createElement('div');
            sec.className = 'section';
            sec.innerHTML = `
                <h3 class="section-title">${type}</h3>
                <div class="row-container">
                    ${groups[type].map(t => `
                        <div class="song-card" onclick="playSong(${tracks.indexOf(t)})">
                            <div class="img-wrapper"><img src="${t.img}" loading="lazy"></div>
                            <b>${t.t}</b>
                            <span>${t.a}</span>
                        </div>`).join('')}
                </div>`;
            body.appendChild(sec);
        }
    }

    function playSong(i) {
        current = i; 
        const s = tracks[i];
        document.getElementById('p-art').src = s.img;
        document.getElementById('p-title').innerText = s.t;
        document.getElementById('p-artist').innerText = s.a;
        audio.src = s.file; audio.play();
        playerView.classList.add('active');
        playIcon.innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
    }

    function closePlayer() { playerView.classList.remove('active'); }

    document.getElementById('playBtn').onclick = () => {
        if(audio.paused) {
            audio.play();
            playIcon.innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
        } else {
            audio.pause();
            playIcon.innerHTML = '<path d="M8 5v14l11-7z"/>';
        }
    };

    function next() { playSong((current + 1) % tracks.length); }
    function prev() { playSong((current - 1 + tracks.length) % tracks.length); }

    audio.ontimeupdate = () => {
        const seek = document.getElementById('seekSlider');
        if(!isNaN(audio.duration)) {
            seek.max = audio.duration;
            seek.value = audio.currentTime;
            document.getElementById('curTime').innerText = fmt(audio.currentTime);
            document.getElementById('durTime').innerText = fmt(audio.duration);
        }
    };
    audio.onended = () => next();
    document.getElementById('seekSlider').oninput = (e) => audio.currentTime = e.target.value;
    document.getElementById('volumeSlider').oninput = (e) => audio.volume = e.target.value / 100;

    function fmt(s) {
        let m = Math.floor(s/60), sc = Math.floor(s%60);
        return m + ":" + (sc < 10 ? '0'+sc : sc);
    }

    function initHero() {
        const hero = document.getElementById('hero-slider');
        if(!tracks.length) return;
        hero.innerHTML = tracks.slice(0,3).map((t, i) => `
            <div class="slide ${i===0?'active':''}" style="background-image: url('${t.img}')"></div>
        `).join('');
        setInterval(() => {
            const slides = document.querySelectorAll('.slide');
            let active = document.querySelector('.slide.active');
            if(active) {
                active.classList.remove('active');
                (active.nextElementSibling || slides[0]).classList.add('active');
            }
        }, 5000);
    }

    load();
</script>
</body>
</html>
