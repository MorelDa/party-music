<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Party Music | Ultra Pro Clean</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --pink: #ff2d55;
            --bg-dark: #050505;
            --bg-card: rgba(255, 255, 255, 0.03);
            --glass: rgba(255, 255, 255, 0.08);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-dark); color: white; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }

        /* --- HEADER ADAPTABLE --- */
        header { height: 70px; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; background: rgba(0,0,0,0.5); z-index: 100; }
        .logo { font-weight: 950; color: var(--pink); font-size: 22px; letter-spacing: -1.5px; min-width: fit-content; }
        
        .search-container { background: #1a1a1a; border-radius: 500px; padding: 10px 20px; width: 100%; max-width: 400px; display: flex; align-items: center; border: 1px solid rgba(255,255,255,0.05); margin: 0 15px; }
        .search-container input { background: none; border: none; color: white; width: 100%; margin-left: 10px; outline: none; font-size: 14px; }

        /* --- LAYOUT RESPONSIVE --- */
        .app-container { display: flex; flex: 1; overflow: hidden; position: relative; }
        
        /* BARRA LATERAL (Escritorio) */
        .side-nav {
            width: 90px; background: rgba(10, 10, 10, 0.9); backdrop-filter: blur(15px);
            border-right: 1px solid rgba(255,255,255,0.05); display: flex; flex-direction: column;
            align-items: center; padding: 40px 0; gap: 35px;
        }

        .content-scroll {
            flex: 1; padding: 25px; overflow-y: auto; scroll-behavior: smooth;
            background: radial-gradient(circle at 50% 0%, #1d080d 0%, #050505 70%);
        }

        /* --- GRIDS ADAPTABLES --- */
        .section-title { font-size: 22px; font-weight: 900; margin: 30px 0 15px; letter-spacing: -0.5px; }
        .grid-pro { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); 
            gap: 15px; 
            margin-bottom: 30px; 
        }

        .pro-card {
            background: var(--bg-card); padding: 12px; border-radius: 18px; cursor: pointer;
            transition: 0.3s; border: 1px solid rgba(255,255,255,0.03);
        }
        .pro-card img { width: 100%; aspect-ratio: 1; border-radius: 12px; object-fit: cover; margin-bottom: 10px; }
        .pro-card b { font-size: 14px; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* --- PLAYER BAR (RESPONSIVE) --- */
        footer {
            height: 90px; background: rgba(10,10,10,0.95); backdrop-filter: blur(25px);
            border-top: 1px solid rgba(255,255,255,0.1); display: flex; align-items: center; 
            padding: 0 15px; position: relative; z-index: 200;
        }
        .info-box { width: 30%; display: flex; align-items: center; gap: 10px; overflow: hidden; }
        .info-box img { width: 50px; height: 50px; border-radius: 8px; flex-shrink: 0; }
        .info-text { overflow: hidden; }
        .info-text div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        .controls-box { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 8px; }
        .main-btns { display: flex; align-items: center; gap: 25px; font-size: 20px; }
        .play-main { width: 42px; height: 42px; background: white; color: black; border-radius: 50%; display: flex; align-items: center; justify-content: center; padding-left: 3px; }

        .progress-container { width: 100%; max-width: 400px; display: flex; align-items: center; gap: 10px; font-size: 11px; color: #777; }
        .bar-wrapper { flex: 1; height: 4px; background: #333; border-radius: 10px; cursor: pointer; position: relative; }
        .bar-progress { height: 100%; background: var(--pink); width: 0%; border-radius: 10px; }

        /* VOLUMEN FIX */
        .volume-box { width: 25%; display: flex; justify-content: flex-end; align-items: center; gap: 10px; }
        .vol-slider { width: 70px; accent-color: var(--pink); cursor: pointer; display: block; }

        /* --- MEDIA QUERIES (MÓVIL) --- */
        @media (max-width: 768px) {
            .side-nav { display: none; } /* Oculta barra lateral en móvil */
            header { padding: 0 15px; }
            .search-container { max-width: 180px; }
            .logo { font-size: 18px; }
            
            .grid-pro { grid-template-columns: repeat(2, 1fr); } /* 2 columnas en móvil */
            .section-title { font-size: 18px; }

            .info-box { width: 50%; }
            .volume-box { display: none; } /* Oculta volumen en móvil (se usa el del cel) */
            .controls-box { width: 50%; }
            .progress-container { display: none; } /* Simplifica el reproductor */
            
            /* Menú inferior móvil */
            .mobile-nav {
                display: flex !important; position: fixed; bottom: 0; left: 0; width: 100%;
                background: #000; height: 65px; border-top: 1px solid #222;
                justify-content: space-around; align-items: center; font-size: 24px; z-index: 300;
            }
            body { padding-bottom: 155px; } /* Espacio para player + nav */
        }

        .mobile-nav { display: none; }
        .nav-item-m { color: #555; cursor: pointer; }
        .nav-item-m.active { color: var(--pink); }
    </style>
</head>
<body>

<header>
    <div class="logo">PARTY MUSIC</div>
    <div class="search-container">
        <span>🔍</span>
        <input type="text" id="searchInput" placeholder="Buscar..." onkeyup="filterSongs()">
    </div>
</header>

<div class="app-container">
    <nav class="side-nav">
        <div class="nav-item active">🏠</div>
        <div class="nav-item">🔍</div>
        <div class="nav-item">❤️</div>
    </nav>

    <main class="content-scroll" id="mainScroll">
        <div id="dynamicSections"></div>
    </main>
</div>

<div class="mobile-nav">
    <div class="nav-item-m active">🏠</div>
    <div class="nav-item-m">🔍</div>
    <div class="nav-item-m">❤️</div>
    <div class="nav-item-m">👤</div>
</div>

<footer>
    <div class="info-box">
        <img src="https://via.placeholder.com/70" id="p-img">
        <div class="info-text">
            <div id="p-title" style="font-weight: 800; font-size: 14px;">Party Music</div>
            <div id="p-artist" style="color: #888; font-size: 11px;">Selecciona pista</div>
        </div>
    </div>
    
    <div class="controls-box">
        <div class="main-btns">
            <span onclick="changeTrack(-1)" style="cursor:pointer">⏮</span>
            <div class="play-main" id="btn-play" onclick="togglePlay()">▶</div>
            <span onclick="changeTrack(1)" style="cursor:pointer">⏭</span>
        </div>
        <div class="progress-container">
            <span id="cur-time">0:00</span>
            <div class="bar-wrapper" id="bar-seek"><div class="bar-progress" id="bar-fill"></div></div>
            <span id="total-time">0:00</span>
        </div>
    </div>

    <div class="volume-box">
        <span>🔊</span>
        <input type="range" class="vol-slider" min="0" max="1" step="0.1" value="1" oninput="setVolume(this.value)">
    </div>
</footer>

<audio id="main-audio"></audio>

<script>
    const audio = document.getElementById('main-audio');
    let musicData = [];
    let currentIdx = 0;

    async function loadData() {
        try {
            const response = await fetch('datos.json');
            musicData = await response.json();
            renderDynamic();
        } catch (e) { console.error(e); }
    }

    function renderDynamic() {
        const container = document.getElementById('dynamicSections');
        container.innerHTML = '';
        const sections = {};
        musicData.forEach((s, i) => {
            if (!sections[s.type]) sections[s.type] = [];
            sections[s.type].push({ ...s, id: i });
        });

        for (const type in sections) {
            container.innerHTML += `<h2 class="section-title">${type}</h2>`;
            const grid = document.createElement('div');
            grid.className = 'grid-pro';
            sections[type].forEach(song => {
                grid.innerHTML += `
                    <div class="pro-card" onclick="playSong(${song.id})">
                        <img src="${song.img}" onerror="this.src='https://via.placeholder.com/200'">
                        <b>${song.t}</b>
                        <small style="color:gray">${song.a}</small>
                    </div>`;
            });
            container.appendChild(grid);
        }
    }

    function playSong(i) {
        currentIdx = i;
        const s = musicData[i];
        document.getElementById('p-img').src = s.img;
        document.getElementById('p-title').innerText = s.t;
        document.getElementById('p-artist').innerText = s.a;
        audio.src = s.file;
        audio.play();
        document.getElementById('btn-play').innerText = "⏸";
    }

    function togglePlay() {
        if(!audio.src) return playSong(0);
        if(audio.paused) { audio.play(); document.getElementById('btn-play').innerText = "⏸"; }
        else { audio.pause(); document.getElementById('btn-play').innerText = "▶"; }
    }

    function changeTrack(dir) {
        currentIdx = (currentIdx + dir + musicData.length) % musicData.length;
        playSong(currentIdx);
    }

    function setVolume(v) { audio.volume = v; }

    audio.ontimeupdate = () => {
        const pct = (audio.currentTime / audio.duration) * 100 || 0;
        document.getElementById('bar-fill').style.width = pct + "%";
        const m = Math.floor(audio.currentTime / 60);
        const s = Math.floor(audio.currentTime % 60);
        document.getElementById('cur-time').innerText = `${m}:${s < 10 ? '0'+s : s}`;
    };

    document.getElementById('bar-seek').onclick = (e) => {
        audio.currentTime = (e.offsetX / e.currentTarget.offsetWidth) * audio.duration;
    };

    function filterSongs() {
        const q = document.getElementById('searchInput').value.toLowerCase();
        document.querySelectorAll('.pro-card').forEach(c => {
            c.style.display = c.innerText.toLowerCase().includes(q) ? 'block' : 'none';
        });
    }

    loadData();
</script>
</body>
</html>
