<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>Party Music | Pro Visual</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --accent: #ff2d55;
            --bg: #030303;
            --glass: rgba(255, 255, 255, 0.04);
            --border: rgba(255, 255, 255, 0.08);
            --text: #ffffff;
            --text-dim: #929292;
            --spotify-green: #1DB954;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; display: flex; flex-direction: column; }

        .main-scroll { flex: 1; overflow-y: auto; padding: 12px; padding-bottom: 120px; }
        .main-scroll::-webkit-scrollbar { display: none; }

        /* TU DISEÑO ORIGINAL */
        .hero { width: 100%; height: 160px; border-radius: 18px; overflow: hidden; position: relative; margin-bottom: 15px; border: 1px solid var(--border); }
        .slide { position: absolute; width: 100%; height: 100%; opacity: 0; transition: 1s; background-size: cover; background-position: center; }
        .slide.active { opacity: 1; }

        .section { margin-bottom: 12px; }
        .section-title { font-size: 14px; font-weight: 800; margin-bottom: 8px; color: var(--accent); text-transform: uppercase; }
        
        .row-container { display: flex; overflow-x: auto; gap: 10px; padding-bottom: 5px; scroll-snap-type: x mandatory; }
        .row-container::-webkit-scrollbar { display: none; }

        .song-card { flex: 0 0 120px; background: var(--glass); border: 1px solid var(--border); padding: 6px; border-radius: 14px; scroll-snap-align: start; cursor: pointer; }
        .song-card img { width: 108px; height: 108px; border-radius: 10px; object-fit: cover; margin-bottom: 4px; display: block; }
        .song-card b { display: block; font-size: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .song-card span { font-size: 9px; color: var(--text-dim); }

        /* --- NUEVO REPRODUCTOR FULL SCREEN (EL QUE PEDISTE) --- */
        #fullscreen-player {
            position: fixed;
            top: 100%; /* Empieza abajo */
            left: 0;
            width: 100%;
            height: 100dvh;
            background: linear-gradient(to bottom, #5038a0 0%, #121212 100%);
            z-index: 2000;
            transition: top 0.4s cubic-bezier(0.3, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
            padding: 20px 25px;
            justify-content: space-between;
        }
        #fullscreen-player.active { top: 0; }

        .top-bar { display: flex; justify-content: space-between; align-items: center; }
        .artwork-nav { flex-grow: 1; display: flex; align-items: center; justify-content: center; padding: 20px 0; }
        .artwork-nav img { width: 100%; max-width: 320px; aspect-ratio: 1/1; border-radius: 8px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
        
        .track-info h1 { font-size: 22px; font-weight: 800; }
        .track-info p { color: #b3b3b3; font-size: 15px; margin-top: 4px; }

        .progress-section { margin: 20px 0; }
        input[type="range"] { width: 100%; accent-color: #fff; height: 4px; cursor: pointer; }
        .time-stamps { display: flex; justify-content: space-between; font-size: 11px; color: #b3b3b3; margin-top: 10px; }

        .main-controls { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .play-pause-circle { width: 65px; height: 65px; background: #fff; border-radius: 50%; display: flex; justify-content: center; align-items: center; }
        
        .vol-wrapper { display: flex; align-items: center; gap: 10px; padding-bottom: 20px; }
        .vol-slider { flex: 1; accent-color: var(--spotify-green); }
    </style>
</head>
<body>

    <main class="main-scroll">
        <div class="hero">
            <div class="slide active" style="background-image: url('https://images.unsplash.com/photo-1470225620780-dba8ba36b745?w=600')"></div>
            <div class="slide" style="background-image: url('https://images.unsplash.com/photo-1493225255756-d9584f8606e9?w=600')"></div>
        </div>
        <div id="app-body"></div>
    </main>

    <div id="fullscreen-player">
        <div class="top-bar">
            <div onclick="closePlayer()" style="cursor:pointer">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="white"><path d="M12 16l-6-6h12z"/></svg>
            </div>
            <span style="font-size: 10px; font-weight:700; text-transform:uppercase;">Reproduciendo ahora</span>
            <svg width="24" height="24" viewBox="0 0 24 24" fill="white"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg>
        </div>

        <div class="artwork-nav">
            <img src="" id="p-art">
        </div>

        <div class="track-info">
            <h1 id="p-title">Título</h1>
            <p id="p-artist">Artista</p>
        </div>

        <div class="progress-section">
            <input type="range" id="seekSlider" value="0" min="0" step="0.1">
            <div class="time-stamps">
                <span id="curTime">0:00</span>
                <span id="durTime">0:00</span>
            </div>
        </div>

        <div class="main-controls">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="#b3b3b3"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg>
            <svg onclick="prev()" width="32" height="32" viewBox="0 0 24 24" fill="white"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
            
            <div class="play-pause-circle" onclick="toggle()">
                <svg id="playIcon" width="28" height="28" viewBox="0 0 24 24" fill="black"><path d="M8 5v14l11-7z"/></svg>
            </div>

            <svg onclick="next()" width="32" height="32" viewBox="0 0 24 24" fill="white"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
            <svg width="24" height="24" viewBox="0 0 24 24" fill="#b3b3b3"><path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/></svg>
        </div>

        <div class="vol-wrapper">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="#b3b3b3"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>
            <input type="range" class="vol-slider" id="volumeSlider" value="100" min="0" max="100">
        </div>
    </div>

    <audio id="audio" crossorigin="anonymous"></audio>

<script>
    const audio = document.getElementById('audio');
    const playerView = document.getElementById('fullscreen-player');
    let tracks = [], current = 0;

    async function load() {
        try {
            const res = await fetch('datos.json');
            tracks = await res.json();
            render();
        } catch(e) { console.error("Error cargando JSON"); }
    }

    function render() {
        const body = document.getElementById('app-body');
        const groups = tracks.reduce((acc, t) => { acc[t.type] = acc[t.type] || []; acc[t.type].push(t); return acc; }, {});
        body.innerHTML = "";
        for (const type in groups) {
            const sec = document.createElement('div');
            sec.className = 'section';
            sec.innerHTML = `<h3 class="section-title">${type}</h3><div class="row-container">${groups[type].map(t => `
                <div class="song-card" onclick="playSong(${tracks.indexOf(t)})"><img src="${t.img}"><b>${t.t}</b><span>${t.a}</span></div>`).join('')}</div>`;
            body.appendChild(sec);
        }
    }

    function playSong(i) {
        current = i; 
        const s = tracks[i];
        
        // Actualizar interfaz del reproductor
        document.getElementById('p-art').src = s.img;
        document.getElementById('p-title').innerText = s.t;
        document.getElementById('p-artist').innerText = s.a;
        
        // Audio
        audio.src = s.file; 
        audio.play();
        
        // Abrir el reproductor y poner icono pausa
        playerView.classList.add('active');
        document.getElementById('playIcon').innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
    }

    function closePlayer() { playerView.classList.remove('active'); }

    function toggle() { 
        if(audio.paused) {
            audio.play();
            document.getElementById('playIcon').innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
        } else {
            audio.pause();
            document.getElementById('playIcon').innerHTML = '<path d="M8 5v14l11-7z"/>';
        }
    }

    function next() { playSong((current + 1) % tracks.length); }
    function prev() { playSong((current - 1 + tracks.length) % tracks.length); }

    // Actualización de barra y tiempo
    audio.ontimeupdate = () => {
        const seek = document.getElementById('seekSlider');
        if(!isNaN(audio.duration)) {
            seek.max = audio.duration;
            seek.value = audio.currentTime;
            document.getElementById('curTime').innerText = fmt(audio.currentTime);
            document.getElementById('durTime').innerText = fmt(audio.duration);
        }
    };

    // CAMBIO AUTOMÁTICO AL TERMINAR
    audio.onended = () => { next(); };

    document.getElementById('seekSlider').oninput = (e) => { audio.currentTime = e.target.value; };
    document.getElementById('volumeSlider').oninput = (e) => { audio.volume = e.target.value / 100; };

    function fmt(s) {
        let m = Math.floor(s/60), sc = Math.floor(s%60);
        return `${m}:${sc<10?'0'+sc:sc}`;
    };

    // Carrusel Hero
    setInterval(() => {
        const slides = document.querySelectorAll('.slide');
        if(slides.length) {
            let active = document.querySelector('.slide.active');
            active.classList.remove('active');
            let nextS = active.nextElementSibling || slides[0];
            nextS.classList.add('active');
        }
    }, 5000);

    load();
</script>
</body>
</html>
