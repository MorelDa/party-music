<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>Party Music Pro</title>
    <style>
        /* --- DISEÑO BASE Y RESET --- */
        :root {
            --pink: #ff2d55;
            --bg-dark: #050505;
            --bg-card: rgba(255, 255, 255, 0.05);
            --text-main: #ffffff;
            --text-dim: #a7a7a7;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        
        body { 
            background: radial-gradient(circle at top left, #1a080c, var(--bg-dark));
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* --- CONTENEDOR PRINCIPAL --- */
        .main-content {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            padding-bottom: 120px; /* Espacio para el reproductor */
        }

        /* --- CARRUSEL DE CABECERA (PROMO) --- */
        .promo-slider {
            width: 100%; height: 180px; border-radius: 15px; overflow: hidden;
            position: relative; margin-bottom: 30px;
        }
        .slide { position: absolute; width: 100%; height: 100%; opacity: 0; transition: 0.8s; background-size: cover; background-position: center; }
        .slide.active { opacity: 1; }
        .slide-overlay { width: 100%; height: 100%; background: linear-gradient(to top, rgba(0,0,0,0.8), transparent); display: flex; align-items: flex-end; padding: 15px; }
        .slide-overlay h2 { font-size: 24px; font-weight: 900; }

        /* --- SECCIONES (CARRUSEL DE UNA FILA) --- */
        .section { margin-bottom: 35px; }
        .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .section-header h3 { font-size: 18px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; }

        .row-container {
            display: flex;
            overflow-x: auto;
            gap: 15px;
            padding-bottom: 10px;
            scroll-snap-type: x mandatory;
            -webkit-overflow-scrolling: touch;
        }
        .row-container::-webkit-scrollbar { display: none; } /* Ocultar scrollbar */

        /* --- TARJETAS (CONTROL DE TAMAÑO) --- */
        .card {
            flex: 0 0 140px; /* Tamaño fijo para que no sean gigantes */
            scroll-snap-align: start;
            background: var(--bg-card);
            padding: 10px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .card img {
            width: 100%;
            aspect-ratio: 1/1;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 8px;
        }
        .card b { display: block; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .card span { font-size: 11px; color: var(--text-dim); }

        /* --- BOTÓN VER MÁS --- */
        .btn-more-container { width: 100%; display: flex; justify-content: center; margin-top: 10px; }
        .btn-ver-mas {
            background: transparent;
            color: var(--pink);
            border: 1px solid var(--pink);
            padding: 6px 20px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
        }

        /* --- REPRODUCTOR MÓVIL (CORREGIDO Y COMPLETO) --- */
        .player-fixed {
            position: fixed;
            bottom: 0; left: 0; width: 100%;
            height: 105px; /* Altura suficiente para que no se corte */
            background: rgba(10, 10, 10, 0.98);
            backdrop-filter: blur(15px);
            border-top: 1px solid rgba(255,255,255,0.1);
            display: flex;
            flex-direction: column;
            padding: 10px 15px;
            z-index: 9999;
        }

        .player-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
        
        .p-info { display: flex; align-items: center; gap: 10px; width: 65%; }
        .p-info img { width: 45px; height: 45px; border-radius: 6px; object-fit: cover; }
        .p-text { overflow: hidden; }
        .p-text div:first-child { font-size: 14px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .p-text div:last-child { font-size: 11px; color: var(--text-dim); }

        .p-controls { display: flex; align-items: center; gap: 15px; }
        .play-btn { 
            width: 38px; height: 38px; background: white; color: black; 
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-size: 16px; cursor: pointer;
        }

        /* --- BARRA DE PROGRESO (VISIBLE Y FUNCIONAL) --- */
        .player-bottom { width: 100%; display: flex; align-items: center; gap: 10px; }
        .progress-box { flex: 1; height: 4px; background: #333; border-radius: 2px; position: relative; }
        .progress-fill { height: 100%; background: var(--pink); width: 0%; border-radius: 2px; }
        .time-label { font-size: 10px; color: var(--text-dim); min-width: 30px; }

        /* --- MODO EXPANDIDO (VER MÁS) --- */
        .expanded {
            display: grid !important;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)) !important;
            overflow-x: hidden !important;
            gap: 15px !important;
        }

        /* --- AJUSTES PARA PC --- */
        @media (min-width: 769px) {
            .main-content { padding: 40px; margin-left: 240px; }
            .card { flex: 0 0 190px; }
            .promo-slider { height: 300px; }
            .player-fixed { height: 90px; flex-direction: row; padding: 0 30px; }
            .player-top { width: 100%; margin: 0; }
            .p-info { width: 30%; }
            .player-bottom { position: absolute; bottom: 15px; left: 50%; transform: translateX(-50%); width: 40%; }
        }
    </style>
</head>
<body>

    <main class="main-content">
        <div class="promo-slider">
            <div class="slide active" style="background-image: url('https://picsum.photos/800/400?sig=1')">
                <div class="slide-overlay"><h2>LO MÁS VIRAL</h2></div>
            </div>
            <div class="slide" style="background-image: url('https://picsum.photos/800/400?sig=2')">
                <div class="slide-overlay"><h2>MIXES 2026</h2></div>
            </div>
        </div>

        <div id="sections-container">
            </div>
    </main>

    <footer class="player-fixed">
        <div class="player-top">
            <div class="p-info">
                <img src="" id="track-img" style="display: none;">
                <div class="p-text">
                    <div id="track-title">Selecciona música</div>
                    <div id="track-artist">SrPromax</div>
                </div>
            </div>
            <div class="p-controls">
                <span onclick="prev()" style="font-size: 20px;">⏮</span>
                <div class="play-btn" id="play-btn" onclick="toggle()">▶</div>
                <span onclick="next()" style="font-size: 20px;">⏭</span>
            </div>
        </div>
        
        <div class="player-bottom">
            <span class="time-label" id="cur-time">0:00</span>
            <div class="progress-box" onclick="seek(event)">
                <div class="progress-fill" id="fill"></div>
            </div>
            <span class="time-label" id="total-time">0:00</span>
        </div>
    </footer>

    <audio id="audio-player"></audio>

<script>
    const audio = document.getElementById('audio-player');
    let songs = [];
    let current = 0;

    // 1. CARGAR DATOS
    async function loadData() {
        try {
            const res = await fetch('datos.json');
            songs = await res.json();
            render();
        } catch (e) { console.error("Error al cargar datos.json"); }
    }

    // 2. RENDERIZAR (CARRUSELES + BOTÓN ABAJO)
    function render() {
        const container = document.getElementById('sections-container');
        const groups = songs.reduce((acc, s) => {
            acc[s.type] = acc[s.type] || [];
            acc[s.type].push(s);
            return acc;
        }, {});

        for (const type in groups) {
            const sec = document.createElement('div');
            sec.className = 'section';
            sec.innerHTML = `
                <div class="section-header"><h3>${type}</h3></div>
                <div class="row-container" id="row-${type}">
                    ${groups[type].map(s => `
                        <div class="card" onclick="playSong(${songs.indexOf(s)})">
                            <img src="${s.img}">
                            <b>${s.t}</b>
                            <span>${s.a}</span>
                        </div>
                    `).join('')}
                </div>
                <div class="btn-more-container">
                    <button class="btn-ver-mas" onclick="toggleGrid('${type}')">Ver más de ${type}</button>
                </div>
            `;
            container.appendChild(sec);
        }
    }

    // 3. LOGICA VER MÁS
    function toggleGrid(type) {
        const row = document.getElementById(`row-${type}`);
        row.classList.toggle('expanded');
    }

    // 4. REPRODUCTOR
    function playSong(i) {
        current = i;
        const s = songs[i];
        document.getElementById('track-img').src = s.img;
        document.getElementById('track-img').style.display = 'block';
        document.getElementById('track-title').innerText = s.t;
        document.getElementById('track-artist').innerText = s.a;
        audio.src = s.file;
        audio.play();
        document.getElementById('play-btn').innerText = '⏸';
    }

    function toggle() {
        if(!audio.src) return playSong(0);
        audio.paused ? (audio.play(), document.getElementById('play-btn').innerText = '⏸') : (audio.pause(), document.getElementById('play-btn').innerText = '▶');
    }

    function next() { playSong((current + 1) % songs.length); }
    function prev() { playSong((current - 1 + songs.length) % songs.length); }

    audio.ontimeupdate = () => {
        const pct = (audio.currentTime / audio.duration) * 100 || 0;
        document.getElementById('fill').style.width = pct + "%";
        const fmt = (s) => { const m=Math.floor(s/60), sec=Math.floor(s%60); return `${m}:${sec<10?'0'+sec:sec}`; };
        document.getElementById('cur-time').innerText = fmt(audio.currentTime);
        if(audio.duration) document.getElementById('total-time').innerText = fmt(audio.duration);
    };

    function seek(e) {
        const pct = e.offsetX / e.currentTarget.offsetWidth;
        audio.currentTime = pct * audio.duration;
    }

    // Carrusel fotos
    let sIdx = 0;
    setInterval(() => {
        const slides = document.querySelectorAll('.slide');
        if(slides.length) {
            slides[sIdx].classList.remove('active');
            sIdx = (sIdx + 1) % slides.length;
            slides[sIdx].classList.add('active');
        }
    }, 4000);

    loadData();
</script>
</body>
</html>
