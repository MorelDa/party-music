<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>Music Fixed Interface</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg: #000;
            --surface: #121212;
            --text-dim: #b3b3b3;
            /* MEDIDAS FIJAS PARA QUE NADA SE MUEVA */
            --card-size: 140px; 
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: var(--bg); color: #fff; height: 100dvh; overflow: hidden; }

        .main-scroll { height: 100%; overflow-y: auto; padding-bottom: 120px; }

        /* SECCIONES */
        .section { margin-top: 25px; }
        .section-title { font-size: 18px; font-weight: 800; margin-left: 16px; margin-bottom: 15px; }
        
        /* CARRUSEL - FORZADO PARA PC Y MÓVIL */
        .row-container { 
            display: flex; 
            overflow-x: auto; 
            gap: 12px; 
            padding: 0 16px 15px 16px;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch; /* Móvil */
            scrollbar-width: none; /* Firefox */
        }
        .row-container::-webkit-scrollbar { display: none; } /* Chrome/PC */

        /* TARJETA CON ALTURA Y ANCHO TOTALMENTE FIJOS */
        .song-card { 
            flex: 0 0 var(--card-size); 
            width: var(--card-size);
            height: 190px; /* Altura total fija: imagen + texto */
            display: flex;
            flex-direction: column;
            cursor: pointer;
            overflow: hidden; /* Evita que cualquier cosa salga del cuadro */
        }

        /* CUADRO DE IMAGEN: NADA LO PUEDE AGRANDAR */
        .img-wrapper {
            width: var(--card-size);
            height: var(--card-size);
            min-height: var(--card-size); /* Bloqueo de altura */
            border-radius: 8px;
            overflow: hidden;
            background: var(--surface);
            margin-bottom: 8px;
        }

        .img-wrapper img { 
            width: 100%; 
            height: 100%; 
            object-fit: cover !important; 
        }

        /* TEXTO: PROHIBIDO OCUPAR MÁS DE UNA LÍNEA */
        .song-card b { 
            display: block; 
            font-size: 13px; 
            white-space: nowrap; 
            overflow: hidden; 
            text-overflow: ellipsis; /* Pone los ... automáticamente */
            width: 100%;
        }
        .song-card span { 
            display: block;
            font-size: 11px; 
            color: var(--text-dim);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 100%;
        }

        /* REPRODUCTOR (Mismo que el anterior pero con ancho fijo en PC) */
        #fullscreen-player {
            position: fixed;
            top: 100%; left: 0; width: 100%; height: 100dvh;
            background: linear-gradient(to bottom, #403080 0%, #000 100%);
            z-index: 2000;
            transition: top 0.4s ease;
            display: flex; justify-content: center;
        }
        #fullscreen-player.active { top: 0; }
        .player-content { width: 100%; max-width: 400px; padding: 25px; display: flex; flex-direction: column; justify-content: space-between; }
        
        @media (min-width: 1024px) {
            --card-size: 170px; /* Un poco más grande en PC pero igual de rígido */
            .song-card { height: 230px; }
        }
    </style>
</head>
<body>

    <main class="main-scroll">
        <div id="app-body"></div>
    </main>

    <div id="fullscreen-player">
        <div class="player-content">
            <div onclick="closePlayer()" style="cursor:pointer">▼</div>
            <img id="p-art" style="width:100%; aspect-ratio:1/1; border-radius:8px; object-fit:cover;">
            <div>
                <h1 id="p-title" style="font-size:22px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;"></h1>
                <p id="p-artist" style="color:var(--text-dim)"></p>
            </div>
            <input type="range" id="seekSlider" style="width:100%; accent-color:#fff;">
            <div style="display:flex; justify-content:center; gap:30px; align-items:center;">
                <button onclick="prev()" style="background:none; border:none; color:#fff; font-size:20px;">⏮</button>
                <div id="playBtn" style="background:#fff; width:60px; height:60px; border-radius:50%; display:flex; align-items:center; justify-content:center; color:#000; font-size:24px; cursor:pointer;">▶</div>
                <button onclick="next()" style="background:none; border:none; color:#fff; font-size:20px;">⏭</button>
            </div>
        </div>
    </div>

    <audio id="audio"></audio>

<script>
    const audio = document.getElementById('audio');
    let tracks = [], current = 0;

    async function load() {
        // Simulando datos para la previsualización
        tracks = [
            {t:"Canción con título extremadamente largo que debería cortarse", a:"Artista de Prueba", img:"https://picsum.photos/400/400?1", type:"Pop"},
            {t:"Short", a:"Artist", img:"https://picsum.photos/400/600?2", type:"Pop"},
            {t:"Imagen Vertical", a:"Prueba", img:"https://picsum.photos/200/500?3", type:"Rock"},
            {t:"Rock n Roll", a:"Legend", img:"https://picsum.photos/800/400?4", type:"Rock"}
        ];
        render();
    }

    function render() {
        const body = document.getElementById('app-body');
        const groups = tracks.reduce((acc, t) => { acc[t.type] = acc[t.type] || []; acc[t.type].push(t); return acc; }, {});
        
        for (const type in groups) {
            const sec = document.createElement('div');
            sec.className = 'section';
            sec.innerHTML = `<h3 class="section-title">${type}</h3><div class="row-container" id="row-${type}">
                ${groups[type].map((t, i) => `
                    <div class="song-card" onclick="playSong(${tracks.indexOf(t)})">
                        <div class="img-wrapper"><img src="${t.img}"></div>
                        <b>${t.t}</b>
                        <span>${t.a}</span>
                    </div>`).join('')}
            </div>`;
            body.appendChild(sec);
            enableMouseWheelScroll(document.getElementById(`row-${type}`));
        }
    }

    // SOLUCIÓN CARRUSEL PC: Habilitar scroll con rueda del ratón
    function enableMouseWheelScroll(el) {
        el.addEventListener('wheel', (evt) => {
            evt.preventDefault();
            el.scrollLeft += evt.deltaY;
        });
    }

    function playSong(i) {
        current = i; 
        document.getElementById('p-art').src = tracks[i].img;
        document.getElementById('p-title').innerText = tracks[i].t;
        document.getElementById('p-artist').innerText = tracks[i].a;
        document.getElementById('fullscreen-player').classList.add('active');
    }

    function closePlayer() { document.getElementById('fullscreen-player').classList.remove('active'); }

    load();
</script>
</body>
</html>
