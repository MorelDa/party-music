<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>Party Music Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --spotify-green: #1DB954;
            --bg: #000000;
            --surface: #121212;
            --text: #ffffff;
            --text-dim: #b3b3b3;
            --border: rgba(255, 255, 255, 0.1);
            
            /* --- TAMAÑO FIJO Y FORZOSO PARA TODAS LAS IMÁGENES --- */
            /* En móvil */
            --img-size-mobile: 130px; 
            /* En PC */
            --img-size-pc: 160px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: var(--text); height: 100dvh; overflow: hidden; display: flex; flex-direction: column; }

        /* --- ESTILOS DE LA WEB (HOME) --- */
        .main-scroll { flex: 1; overflow-y: auto; padding-bottom: 100px; scrollbar-width: none; }
        .main-scroll::-webkit-scrollbar { display: none; }

        .hero-container { padding: 16px; }
        .hero { 
            width: 100%; height: 160px; border-radius: 12px; overflow: hidden; position: relative; 
            background: #1a1a1a; box-shadow: 0 8px 25px rgba(0,0,0,0.5);
        }
        .slide { position: absolute; width: 100%; height: 100%; opacity: 0; transition: 1s; background-size: cover; background-position: center; }
        .slide.active { opacity: 1; }

        .section { margin-top: 25px; }
        .section-title { font-size: 18px; font-weight: 800; margin: 0 16px 12px 16px; letter-spacing: -0.5px; color: #fff; }
        
        /* Carrusel Horizontal Profesional */
        .row-container { 
            display: flex; overflow-x: auto; gap: 14px; padding: 0 16px 10px 16px;
            scroll-snap-type: x mandatory; scrollbar-width: none;
            flex-wrap: nowrap; /* Evita que caigan los bloques */
            align-items: flex-start; /* Alinea al top para evitar estiramientos */
        }
        .row-container::-webkit-scrollbar { display: none; }

        /* TARJETA - Ancho Fijo Forzoso */
        .song-card { 
            flex: 0 0 var(--img-size-mobile); /* Ancho exacto igual a la imagen en móvil */
            scroll-snap-align: start; 
            cursor: pointer; 
            display: flex;
            flex-direction: column;
        }
        
        /* CUADRO PERFECTO 1:1 - FORZADO CON MEDIDAS FIJAS */
        .img-wrapper {
            width: var(--img-size-mobile); 
            height: var(--img-size-mobile); 
            border-radius: 8px; 
            overflow: hidden;
            background: var(--surface); 
            border: 1px solid var(--border); 
            margin-bottom: 8px;
            flex-shrink: 0; /* Imprescindible para que no se deforme */
        }
        
        .song-card img { 
            width: 100% !important; 
            height: 100% !important; 
            object-fit: cover !important; /* Corta y adapta la imagen sin estirarla */
            display: block; 
        }
        
        /* Texto de la tarjeta */
        .song-card b { 
            display: block; 
            font-size: 12px; 
            font-weight: 600; 
            white-space: nowrap; 
            overflow: hidden; 
            text-overflow: ellipsis; 
            color: #fff;
            margin-bottom: 2px;
        }
        .song-card span { 
            font-size: 10px; 
            color: var(--text-dim); 
            display: block;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* --- RESPONSIVE PARA PC --- */
        @media (min-width: 1024px) {
            .section-title { font-size: 22px; margin-bottom: 18px; }
            .row-container { gap: 18px; }
            .song-card { flex: 0 0 var(--img-size-pc); }
            .img-wrapper { width: var(--img-size-pc); height: var(--img-size-pc); border-radius: 10px; }
            .song-card b { font-size: 14px; }
            .song-card span { font-size: 12px; }
        }

        /* --- REPRODUCTOR FULL SCREEN (MANTENIDO) --- */
        #fullscreen-player {
            position: fixed;
            top: 100%; left: 0; width: 100%; height: 100dvh;
            background: linear-gradient(to bottom, #5038a0 0%, #121212 100%);
            z-index: 2000;
            transition: top 0.4s cubic-bezier(0.3, 0, 0.2, 1);
            display: flex; flex-direction: column; padding: 15px 25px 30px 25px; justify-content: space-between;
        }
        #fullscreen-player.active { top: 0; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; height: 40px; }
        .top-bar span { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; }
        .artwork-nav { flex-grow: 1; display: flex; align-items: center; justify-content: center; padding: 20px 0; }
        .artwork-nav img { width: 100%; aspect-ratio: 1/1; border-radius: 4px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); object-fit: cover; }
        .track-info { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .track-info h1 { font-size: 22px; font-weight: 800; }
        .track-info p { color: var(--text-dim); font-size: 15px; margin-top: 4px; }
        .progress-section { margin-bottom: 20px; }
        .progress-section input[type="range"] { width: 100%; accent-color: #fff; height: 4px; }
        .time-stamps { display: flex; justify-content: space-between; font-size: 11px; color: var(--text-dim); margin-top: 10px; }
        .main-controls { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .play-pause-circle { 
            width: 65px; height: 65px; background: #fff; border-radius: 50%; 
            display: flex; justify-content: center; align-items: center; 
        }
        .bottom-device-bar { display: flex; align-items: center; justify-content: space-between; padding-top: 10px; }
        .volume-wrapper { display: flex; align-items: center; gap: 10px; flex-grow: 1; margin-right: 15px; }
        .volume-wrapper input { accent-color: var(--spotify-green) !important; height: 3px; width: 100%; }
        .device-icon { color: var(--spotify-green); font-size: 14px; display: flex; align-items: center; gap: 5px; font-weight: bold;}
    </style>
</head>
<body>

    <main class="main-scroll">
        <div class="hero-container">
            <div class="hero" id="hero-slider">
                </div>
        </div>
        <div id="app-body"></div>
    </main>

    <div id="fullscreen-player">
        <div class="top-bar">
            <svg onclick="closePlayer()" width="24" height="24" viewBox="0 0 24 24" fill="white" style="cursor:pointer"><path d="M12 16l-6-6h12z"/></svg>
            <span>Reproduciendo de tu biblioteca</span>
            <svg width="24" height="24" viewBox="0 0 24 24" fill="white"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg>
        </div>

        <div class="artwork-nav">
            <img id="p-art" src="" alt="Cover">
        </div>

        <div class="track-info">
            <div>
                <h1 id="p-title">Cargando...</h1>
                <p id="p-artist">Artista</p>
            </div>
            <svg width="24" height="24" viewBox="0 0 24 24" fill="#1DB954"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
        </div>

        <div class="progress-section">
            <input type="range" id="seekSlider" value="0" min="0" step="0.1">
            <div class="time-stamps">
                <span id="curTime">0:00</span>
                <span id="durTime">0:00</span>
            </div>
        </div>

        <div class="main-controls">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="#b3b3b3"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg>
            <svg onclick="prev()" width="32" height="32" viewBox="0 0 24 24" fill="white"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
            
            <div class="play-pause-circle" id="playBtn">
                <svg id="playIcon" width="28" height="28" viewBox="0 0 24 24" fill="black"><path d="M8 5v14l11-7z"/></svg>
            </div>

            <svg onclick="next()" width="32" height="32" viewBox="0 0 24 24" fill="white"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
            <svg width="24" height="24" viewBox="0 0 24 24" fill="#b3b3b3"><path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/></svg>
        </div>

        <div class="bottom-device-bar">
            <div class="device-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M20 18H4v-7h16v7zm1-9H3c-1.1 0-2 .9-2 2v8c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2v-8c0-1.1-.9-2-2-2zM12 3L1 9h22L12 3z"/></svg>
                <span>Dispositivo conectado</span>
            </div>
            
            <div class="volume-wrapper">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="#b3b3b3"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>
                <input type="range" id="volumeSlider" value="80" min="0" max="100">
            </div>
        </div>
    </div>

    <audio id="audio" crossorigin="anonymous"></audio>

<script>
    const audio = document.getElementById('audio');
    const playerView = document.getElementById('fullscreen-player');
    const playIcon = document.getElementById('playIcon');
    let tracks = [], current = 0;

    async function load() {
        try {
            const res = await fetch('datos.json');
            tracks = await res.json();
            render();
            initHero();
        } catch(e) { console.error("Error cargando JSON"); }
    }

    function render() {
        const body = document.getElementById('app-body');
        const groups = tracks.reduce((acc, t) => { acc[t.type] = acc[t.type] || []; acc[t.type].push(t); return acc; }, {});
        body.innerHTML = "";
        
        for (const type in groups) {
            const sec = document.createElement('div');
            sec.className = 'section';
            sec.innerHTML = `
                <h3 class="section-title">${type}</h3>
                <div class="row-container">
                    ${groups[type].map(t => `
                        <div class="song-card" onclick="playSong(${tracks.indexOf(t)})">
                            <div class="img-wrapper"><img src="${t.img}" loading="lazy"></div>
                            <b>${t.t}</b>
                            <span>${t.a}</span>
                        </div>`).join('')}
                </div>`;
            body.appendChild(sec);
        }
    }

    function playSong(i) {
        current = i; 
        const s = tracks[i];
        document.getElementById('p-art').src = s.img;
        document.getElementById('p-title').innerText = s.t;
        document.getElementById('p-artist').innerText = s.a;
        audio.src = s.file; audio.play();
        playerView.classList.add('active');
        playIcon.innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
    }

    function closePlayer() { playerView.classList.remove('active'); }

    document.getElementById('playBtn').onclick = () => {
        if(audio.paused) {
            audio.play();
            playIcon.innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
        } else {
            audio.pause();
            playIcon.innerHTML = '<path d="M8 5v14l11-7z"/>';
        }
    };

    function next() { playSong((current + 1) % tracks.length); }
    function prev() { playSong((current - 1 + tracks.length) % tracks.length); }

    audio.ontimeupdate = () => {
        const seek = document.getElementById('seekSlider');
        if(!isNaN(audio.duration)) {
            seek.max = audio.duration;
            seek.value = audio.currentTime;
            document.getElementById('curTime').innerText = fmt(audio.currentTime);
            document.getElementById('durTime').innerText = fmt(audio.duration);
        }
    };
    audio.onended = () => next();
    document.getElementById('seekSlider').oninput = (e) => audio.currentTime = e.target.value;
    document.getElementById('volumeSlider').oninput = (e) => audio.volume = e.target.value / 100;

    function fmt(s) {
        let m = Math.floor(s/60), sc = Math.floor(s%60);
        return m + ":" + (sc < 10 ? '0'+sc : sc);
    }

    function initHero() {
        const hero = document.getElementById('hero-slider');
        if(tracks.length === 0) return;
        hero.innerHTML = tracks.slice(0,3).map((t, i) => `
            <div class="slide ${i===0?'active':''}" style="background-image: url('${t.img}')"></div>
        `).join('');
        
        if(tracks.length < 2) return;
        setInterval(() => {
            const slides = document.querySelectorAll('.slide');
            if(slides.length < 2) return;
            let active = document.querySelector('.slide.active');
            if(!active) return;
            active.classList.remove('active');
            (active.nextElementSibling || slides[0]).classList.add('active');
        }, 5000);
    }

    load();
</script>
</body>
</html>
