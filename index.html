<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <link rel="stylesheet" href="css/style.css">
    <title>Party Music Pro</title>
    
    <style>
        /* --- INTEGRACIÓN DEL CARRUSEL (Estilos que faltaban) --- */
        .promo-slider {
            width: 100%; height: 300px; border-radius: 20px; overflow: hidden; position: relative; 
            margin-bottom: 30px; border: 1px solid rgba(255,255,255,0.05);
        }
        .slide { position: absolute; width: 100%; height: 100%; opacity: 0; transition: 1.2s ease-in-out; background-size: cover; background-position: center; }
        .slide.active { opacity: 1; }
        .slide-content { background: linear-gradient(to right, rgba(0,0,0,0.8), transparent); width: 100%; height: 100%; display: flex; align-items: center; padding: 40px; font-size: 36px; font-weight: 900; color: white; }

        /* --- CORRECCIONES MÓVIL PROFESIONAL --- */
        @media (max-width: 768px) {
            .root { grid-template-areas: "main-view" "web-player"; grid-template-columns: 1fr; }
            .navegacion { display: none; } /* Ocultar barra lateral en móvil */
            
            .promo-slider { height: 180px; border-radius: 12px; }
            .slide-content { font-size: 20px; }

            /* Imagen de cabecera pequeña en móvil */
            .img-liked-list img { width: 90px !important; height: 90px !important; }
            .songs-liked .title { font-size: 1.5rem !important; }

            /* Lista de canciones compacta */
            .content-music-list { 
                grid-template-columns: [index] 25px [first] 1fr [last] 50px !important; 
                padding: 0 10px !important;
            }
            /* Ocultar columnas que no caben en móvil */
            .content-playlist-nav div:nth-child(3), .content-playlist-nav div:nth-child(4),
            .content-music-list div:nth-child(3), .content-music-list div:nth-child(4) { display: none; }
            
            /* Imágenes de la lista más pequeñas */
            .title-header-music img { width: 32px !important; height: 32px !important; }
            
            /* Reproductor móvil */
            .options-player { display: none; } /* Ocultar volumen */
            .progress-bar { display: none; } /* Ocultar barra de tiempo */
            .author-play { width: 60%; }
            .reproductor { width: 40%; }
        }

        /* Estilo para saber qué canción está sonando */
        .content-music-list.playing { background: rgba(255,255,255,0.1); border-radius: 5px; }
        .content-music-list.playing .title-music span:first-child { color: #1ed760; }
    </style>
</head>
<body>
    <div id="main">
        <div class="parent-root">
            <div class="root">
                <div class="navegacion">
                    <nav class="nav-principal">
                        <div class="nav-header">
                            <ul>
                                <li><a href="#"><img width="24px" height="24px" src="img/home-icon.svg"><span>Inicio</span></a></li>
                                <li><a href="#"><img width="24px" height="24px" src="img/search-icon.svg"><span>Buscar</span></a></li>
                            </ul>
                        </div>
                        <div class="nav-songs">
                            <header>
                                <div class="nav-biblioteca">
                                    <div class="library-div">
                                        <button class="btn-library">
                                            <img width="24px" height="24px" src="img/library-icon.svg">
                                            <span>Tu biblioteca</span>
                                        </button>
                                    </div>
                                </div>
                            </header>
                        </div>
                    </nav>
                </div>

                <section class="content">
                    <div class="header-content">
                        <div class="nav-content">
                            <div class="buttons-next-prev">
                                <button><img width="26px" height="26px" src="img/button-prev-icon.svg"></button>
                                <button><img width="26px" height="26px" src="img/button-next-icon.svg"></button>
                            </div>
                        </div>
                        <div class="liked-list-header">
                            <div class="img-liked-list">
                                <img width="192" height="192" src="img/liked-songs-icon.png">
                            </div>
                            <div class="songs-liked">
                                <span>Lista</span>
                                <h1 class="title">Tus éxitos de hoy</h1>
                                <div class="promax-liked-list">
                                    <div class="promax-perfil"><span>SrPromax</span></div>
                                    <span id="total-tracks">• 0 canciones</span>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="nav-play">
                        <div class="promo-slider">
                            <div class="slide active" style="background-image: url('https://picsum.photos/1200/400?random=5');">
                                <div class="slide-content">NUEVOS LANZAMIENTOS 🎵</div>
                            </div>
                            <div class="slide" style="background-image: url('https://picsum.photos/1200/400?random=9');">
                                <div class="slide-content">MÚSICA SIN LÍMITES 🚀</div>
                            </div>
                        </div>

                        <div class="btn-play-content">
                            <div class="btn-play-bg">
                                <button id="play-btn-main"><img height="20px" width="20px" src="img/playlist/play-icon.svg"></button>
                            </div>
                        </div>

                        <div class="content-playlist">
                            <div class="content-playlist-nav">
                                <div>#</div><div>Título</div><div>Álbum</div><div>Fecha</div><div class="clock">🕒</div>
                            </div>
                        </div>

                        <div id="music-container" class="content-container"></div>
                    </div>
                </section>

                <div class="web-player">
                    <footer>
                        <div class="author-play">
                            <img width="56px" height="56px" src="img/playlist/chayanne-icon.jpg" id="player-img">
                            <div class="artist-description">
                                <p><span class="name-author" id="player-title">Selecciona una pista</span></p>
                                <div><span id="player-artist">---</span></div>
                            </div>
                        </div>

                        <div class="reproductor">
                            <div class="reproductos-buttons">
                                <button id="prev-btn"><img width="18px" height="18px" src="img/playlist/back-icon.svg"></button>
                                <button class="btn-play" id="play-btn-footer"><img width="18px" height="18px" src="img/playlist/play-icon.svg"></button>
                                <button id="next-btn"><img width="18px" height="18px" src="img/playlist/next-icon.svg"></button>
                            </div>
                            <div class="progress-bar">
                                <div id="time-now">0:00</div>
                                <div class="progress-bar-music" id="progress-bar" style="cursor:pointer">
                                    <div id="progress-inner" style="height:100%; width:0%; background:#1ed760; border-radius:10px;"></div>
                                </div>
                                <div id="time-end">0:00</div>
                            </div>
                        </div>

                        <div class="options-player">
                            <div class="progress-bar-mv">
                                <button><img src="img/sound-icon.svg" width="20px"></button>
                                <div class="progress-bar-volume" id="vol-bar" style="cursor:pointer">
                                    <div id="vol-inner" style="height:100%; width:100%; background:#1ed760; border-radius:5px;"></div>
                                </div>
                            </div>
                        </div>
                    </footer>
                </div>
            </div>
        </div>
    </div>

    <audio id="main-audio"></audio>

    <script>
        const audio = document.getElementById('main-audio');
        const container = document.getElementById('music-container');
        let songs = [];
        let index = 0;

        // CARGAR DATOS DEL JSON
        async function load() {
            try {
                const res = await fetch('datos.json');
                songs = await res.json();
                document.getElementById('total-tracks').innerText = `• ${songs.length} canciones`;
                render();
            } catch (e) { console.log("Falta datos.json o error de carga"); }
        }

        function render() {
            container.innerHTML = '';
            songs.forEach((s, i) => {
                const div = document.createElement('div');
                div.className = 'content-music-list';
                div.onclick = () => play(i);
                div.innerHTML = `
                    <div>${i+1}</div>
                    <div class="title-header-music">
                        <div><img height="40px" width="40px" src="${s.img}"></div>
                        <div class="title-music"><span>${s.t}</span><span>${s.a}</span></div>
                    </div>
                    <div>${s.type || 'Sencillo'}</div>
                    <div>Hoy</div>
                    <div class="icon-love-time"><img height="20px" width="20px" src="img/playlist/love-icon.svg"></div>
                `;
                container.appendChild(div);
            });
        }

        function play(i) {
            index = i;
            const s = songs[i];
            document.getElementById('player-img').src = s.img;
            document.getElementById('player-title').innerText = s.t;
            document.getElementById('player-artist').innerText = s.a;
            audio.src = s.file;
            audio.play();
            updateIcons(true);
            
            // Marcar canción activa
            document.querySelectorAll('.content-music-list').forEach((el, idx) => {
                el.classList.toggle('playing', idx === i);
            });
        }

        function updateIcons(bol) {
            const path = bol ? "img/playlist/pause-icon.svg" : "img/playlist/play-icon.svg";
            document.querySelector('#play-btn-main img').src = path;
            document.querySelector('#play-btn-footer img').src = path;
        }

        // EVENTOS
        const toggle = () => {
            if(!audio.src) return play(0);
            audio.paused ? (audio.play(), updateIcons(true)) : (audio.pause(), updateIcons(false));
        };
        document.getElementById('play-btn-main').onclick = toggle;
        document.getElementById('play-btn-footer').onclick = toggle;
        document.getElementById('next-btn').onclick = () => play((index+1)%songs.length);
        document.getElementById('prev-btn').onclick = () => play((index-1+songs.length)%songs.length);

        // BARRA DE PROGRESO
        audio.ontimeupdate = () => {
            const p = (audio.currentTime / audio.duration) * 100 || 0;
            document.getElementById('progress-inner').style.width = p + "%";
            const fmt = (t) => { const m=Math.floor(t/60), s=Math.floor(t%60); return `${m}:${s<10?'0'+s:s}`; };
            document.getElementById('time-now').innerText = fmt(audio.currentTime);
            if(audio.duration) document.getElementById('time-end').innerText = fmt(audio.duration);
        };

        document.getElementById('progress-bar').onclick = (e) => {
            audio.currentTime = (e.offsetX / e.currentTarget.offsetWidth) * audio.duration;
        };

        // VOLUMEN
        document.getElementById('vol-bar').onclick = (e) => {
            const v = e.offsetX / e.currentTarget.offsetWidth;
            audio.volume = v;
            document.getElementById('vol-inner').style.width = (v*100) + "%";
        };

        // AUTO-CARRUSEL
        let sIdx = 0;
        setInterval(() => {
            const sl = document.querySelectorAll('.slide');
            if(sl.length){
                sl[sIdx].classList.remove('active');
                sIdx = (sIdx + 1) % sl.length;
                sl[sIdx].classList.add('active');
            }
        }, 5000);

        load();
    </script>
</body>
</html>
