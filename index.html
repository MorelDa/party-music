<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>Party Music | Pro Visual</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --accent: #ff2d55;
            --bg: #030303;
            --glass: rgba(255, 255, 255, 0.04);
            --border: rgba(255, 255, 255, 0.08);
            --text: #ffffff;
            --text-dim: #929292;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; display: flex; flex-direction: column; }

        .main-scroll { flex: 1; overflow-y: auto; padding: 12px; padding-bottom: 120px; scrollbar-width: none; }
        .main-scroll::-webkit-scrollbar { display: none; }

        /* HERO AJUSTADO */
        .hero { width: 100%; height: 160px; border-radius: 18px; overflow: hidden; position: relative; margin-bottom: 15px; border: 1px solid var(--border); }
        .slide { position: absolute; width: 100%; height: 100%; opacity: 0; transition: 1s; background-size: cover; background-position: center; }
        .slide.active { opacity: 1; }

        /* SECCIONES COMPACTAS (Solución al hueco grande) */
        .section { margin-bottom: 12px; } /* Reducido de 30px a 12px */
        .section-title { font-size: 14px; font-weight: 800; margin-bottom: 8px; color: var(--accent); text-transform: uppercase; }
        
        .row-container { 
            display: flex; 
            overflow-x: auto; 
            gap: 10px; 
            padding-bottom: 5px; /* Evita hueco inferior */
            scroll-snap-type: x mandatory; 
        }
        .row-container::-webkit-scrollbar { display: none; }

        /* TARJETAS PROFESIONALES (Tamaño Garantizado) */
        .song-card {
            flex: 0 0 120px; /* Ancho fijo */
            background: var(--glass);
            border: 1px solid var(--border);
            padding: 6px;
            border-radius: 14px;
            scroll-snap-align: start;
        }

        .song-card img { 
            width: 108px; /* Ancho interior fijo */
            height: 108px; /* ALTO FIJO PARA TODAS */
            border-radius: 10px; 
            object-fit: cover; /* CORTA LA IMAGEN SI NO ES CUADRADA */
            margin-bottom: 4px;
            display: block;
        }

        .song-card b { 
            display: block; 
            font-size: 10px; 
            white-space: nowrap; 
            overflow: hidden; 
            text-overflow: ellipsis; 
            line-height: 1.2;
        }

        .song-card span { font-size: 9px; color: var(--text-dim); }

        /* REPRODUCTOR ANTI-COLISIÓN */
        .floating-player {
            position: fixed; bottom: 10px; left: 50%; transform: translateX(-50%);
            width: 96%; max-width: 800px; height: 70px;
            background: rgba(10, 10, 10, 0.9); backdrop-filter: blur(20px);
            border: 1px solid var(--border); border-radius: 20px;
            display: flex; align-items: center; padding: 0 12px; z-index: 1000;
        }

        .track-display { width: 40%; display: flex; align-items: center; gap: 10px; overflow: hidden; }
        .track-display img { width: 45px; height: 45px; border-radius: 8px; object-fit: cover; flex-shrink: 0; }
        .track-meta { overflow: hidden; }
        .track-meta b { font-size: 11px; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .track-meta span { font-size: 9px; color: var(--text-dim); }

        .main-controls { flex: 1; display: flex; flex-direction: column; align-items: center; min-width: 130px; }
        .control-btns { display: flex; align-items: center; gap: 12px; }
        .play-main-btn { width: 35px; height: 35px; background: #fff; color: #000; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px; }
        
        .timeline-box { width: 100%; display: flex; align-items: center; gap: 6px; font-size: 8px; margin-top: 4px; }
        .timeline-rail { flex: 1; height: 3px; background: rgba(255,255,255,0.1); border-radius: 10px; }
        .timeline-fill { height: 100%; background: var(--accent); width: 0%; }

        @media (max-width: 768px) {
            .track-display { width: 50%; }
            .main-controls { align-items: flex-end; }
            .timeline-box { position: absolute; bottom: 4px; left: 12px; width: calc(100% - 24px); }
        }
    </style>
</head>
<body>
    <main class="main-scroll">
        <div class="hero">
            <div class="slide active" style="background-image: url('https://images.unsplash.com/photo-1470225620780-dba8ba36b745?w=600')"></div>
            <div class="slide" style="background-image: url('https://images.unsplash.com/photo-1493225255756-d9584f8606e9?w=600')"></div>
        </div>
        <div id="app-body"></div>
    </main>

    <footer class="floating-player">
        <div class="track-display">
            <img src="https://i.scdn.co/image/ab67616d0000b2734190897f564771746401037f" id="player-art">
            <div class="track-meta"><b id="player-t">Selecciona Música</b><span id="player-a">Artista</span></div>
        </div>
        <div class="main-controls">
            <div class="control-btns">
                <span id="shf" onclick="tShf()" style="cursor:pointer; font-size:12px; color:#555">🔀</span>
                <span onclick="prev()" style="cursor:pointer">⏮</span>
                <div class="play-main-btn" id="play-btn" onclick="toggle()">▶</div>
                <span onclick="next()" style="cursor:pointer">⏭</span>
                <span id="lop" onclick="tLop()" style="cursor:pointer; font-size:12px; color:#555">🔁</span>
            </div>
            <div class="timeline-box">
                <span id="cur">0:00</span>
                <div class="timeline-rail"><div class="timeline-fill" id="fill"></div></div>
                <span id="dur">0:00</span>
            </div>
        </div>
    </footer>

    <audio id="audio" crossorigin="anonymous"></audio>

<script>
    // Lógica de carga y reproducción (Simplificada para rendimiento)
    const audio = document.getElementById('audio');
    let tracks = [], current = 0, isShf = false, isLop = false;

    async function load() {
        try {
            const res = await fetch('datos.json');
            tracks = await res.json();
            render();
        } catch(e) { console.error("Error cargando JSON"); }
    }

    function render() {
        const body = document.getElementById('app-body');
        const groups = tracks.reduce((acc, t) => { acc[t.type] = acc[t.type] || []; acc[t.type].push(t); return acc; }, {});
        body.innerHTML = "";
        for (const type in groups) {
            const sec = document.createElement('div');
            sec.className = 'section';
            sec.innerHTML = `<h3 class="section-title">${type}</h3><div class="row-container">${groups[type].map(t => `
                <div class="song-card" onclick="playSong(${tracks.indexOf(t)})"><img src="${t.img}"><b>${t.t}</b><span>${t.a}</span></div>`).join('')}</div>`;
            body.appendChild(sec);
        }
    }

    function playSong(i) {
        current = i; const s = tracks[i];
        document.getElementById('player-art').src = s.img;
        document.getElementById('player-t').innerText = s.t;
        document.getElementById('player-a').innerText = s.a;
        audio.src = s.file; audio.play();
        document.getElementById('play-btn').innerText = '⏸';
    }

    function toggle() { audio.paused ? (audio.play(), document.getElementById('play-btn').innerText = '⏸') : (audio.pause(), document.getElementById('play-btn').innerText = '▶'); }
    function next() { isShf ? playSong(Math.floor(Math.random()*tracks.length)) : playSong((current+1)%tracks.length); }
    function prev() { playSong((current-1+tracks.length)%tracks.length); }
    function tShf() { isShf = !isShf; document.getElementById('shf').style.color = isShf ? 'var(--accent)' : '#555'; }
    function tLop() { isLop = !isLop; audio.loop = isLop; document.getElementById('lop').style.color = isLop ? 'var(--accent)' : '#555'; }

    audio.ontimeupdate = () => {
        const pct = (audio.currentTime/audio.duration)*100 || 0;
        document.getElementById('fill').style.width = pct + "%";
        const fmt = (s) => { const m=Math.floor(s/60), sc=Math.floor(s%60); return `${m}:${sc<10?'0'+sc:sc}`; };
        document.getElementById('cur').innerText = fmt(audio.currentTime);
        if(audio.duration) document.getElementById('dur').innerText = fmt(audio.duration);
    };
    audio.onended = () => { if(!isLop) next(); };

    setInterval(() => {
        const slides = document.querySelectorAll('.slide');
        if(slides.length) {
            let active = document.querySelector('.slide.active');
            active.classList.remove('active');
            let nextS = active.nextElementSibling || slides[0];
            nextS.classList.add('active');
        }
    }, 5000);

    load();
</script>
</body>
</html>
