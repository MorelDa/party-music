<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Panel Party Music | Fix Total</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --pink: #ff2d55; --bg: #050505; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: var(--bg); color: white; padding: 20px; }
        .card { background: #111; border-radius: 20px; padding: 25px; border: 1px solid #222; max-width: 900px; margin: auto; }
        
        .upload-section { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin: 20px 0; }
        .drop-btn { background: #1a1a1a; border: 2px dashed #444; padding: 30px; border-radius: 15px; text-align: center; cursor: pointer; transition: 0.3s; }
        .drop-btn:hover { border-color: var(--pink); background: #222; }
        
        .tag-box { background: #000; border: 1px solid #333; color: var(--pink); padding: 15px; width: 100%; border-radius: 10px; text-align: center; font-weight: 900; font-size: 18px; margin-bottom: 20px; outline: none; }

        table { width: 100%; border-collapse: collapse; margin-top: 20px; background: #000; border-radius: 10px; overflow: hidden; }
        th { background: #1a1a1a; color: #555; font-size: 11px; text-transform: uppercase; padding: 12px; text-align: left; }
        td { padding: 10px; border-bottom: 1px solid #111; font-size: 13px; }

        .img-box { width: 50px; height: 50px; border-radius: 6px; object-fit: cover; background: #222; display: block; border: 1px solid #333; }
        .badge { font-size: 9px; font-weight: 900; padding: 3px 7px; border-radius: 4px; text-transform: uppercase; }
        .badge-ok { background: #00ff0022; color: #00ff00; }
        .badge-error { background: #ff2d5522; color: #ff2d55; }

        .btn-main { background: var(--pink); color: white; border: none; padding: 20px; width: 100%; border-radius: 15px; font-weight: 900; font-size: 18px; cursor: pointer; margin-top: 20px; box-shadow: 0 10px 20px rgba(255,45,85,0.2); }
    </style>
</head>
<body>

<div class="card">
    <h1 style="text-align:center; color:var(--pink); font-size:28px">SOLUCIONADOR DE IMÁGENES</h1>
    <p style="text-align:center; color:#666; font-size:12px; margin-top:5px">Los nombres ya no tienen que ser exactos.</p>

    <div style="margin-top:25px">
        <label style="font-size:10px; color:#555; margin-left:5px">ETIQUETA PARA TODO:</label>
        <input type="text" id="globalTag" class="tag-box" value="Música Variada 2026">
    </div>

    <div class="upload-section">
        <div class="drop-btn" onclick="document.getElementById('mIn').click()">
            <strong>🎵 CARGAR MP3</strong>
            <p id="mCount" style="font-size:11px; color:#666">0 archivos</p>
            <input type="file" id="mIn" multiple accept="audio/mp3" style="display:none" onchange="process()">
        </div>
        <div class="drop-btn" onclick="document.getElementById('iIn').click()">
            <strong>🖼 CARGAR FOTOS</strong>
            <p id="iCount" style="font-size:11px; color:#666">0 archivos</p>
            <input type="file" id="iIn" multiple accept="image/*" style="display:none" onchange="process()">
        </div>
    </div>

    <table id="table" style="display:none">
        <thead>
            <tr>
                <th width="70">Portada</th>
                <th>Nombre Canción</th>
                <th width="100">Estado</th>
            </tr>
        </thead>
        <tbody id="list"></tbody>
    </table>

    <button class="btn-main" onclick="download()">GENERAR ARCHIVO .ZIP</button>
</div>

<script>
    let imgStore = new Map();

    // Función mágica que limpia nombres (quita números, espacios, guiones)
    function cleanName(str) {
        return str.toLowerCase()
            .replace(/^\d+[\s.-]+/, '') // Quita números al inicio
            .replace(/[^a-z0-9]/g, '')  // Quita todo lo que no sea letra o número
            .trim();
    }

    function process() {
        const mFiles = document.getElementById('mIn').files;
        const iFiles = document.getElementById('iIn').files;
        const list = document.getElementById('list');
        
        document.getElementById('mCount').innerText = mFiles.length + " archivos";
        document.getElementById('iCount').innerText = iFiles.length + " archivos";

        if(mFiles.length > 0) document.getElementById('table').style.display = 'table';

        // Guardar imágenes en memoria limpia
        imgStore.clear();
        for(let f of iFiles) {
            let base = f.name.split('.').slice(0, -1).join('.');
            imgStore.set(cleanName(base), f);
        }

        list.innerHTML = "";
        
        Array.from(mFiles).forEach(file => {
            const originalName = file.name.split('.').slice(0, -1).join('.');
            const matchKey = cleanName(originalName);
            const foundImg = imgStore.get(matchKey);
            
            let imgPreview = `<div class="img-box"></div>`;
            let badge = `<span class="badge badge-error">Falta Imagen</span>`;

            if(foundImg) {
                imgPreview = `<img src="${URL.createObjectURL(foundImg)}" class="img-box">`;
                badge = `<span class="badge badge-ok">Encontrada</span>`;
            }

            const row = document.createElement('tr');
            row.innerHTML = `
                <td>${imgPreview}</td>
                <td style="font-weight:700">${originalName}</td>
                <td>${badge}</td>
            `;
            list.appendChild(row);
        });
    }

    async function download() {
        const zip = new JSZip();
        const tag = document.getElementById('globalTag').value;
        const mFiles = document.getElementById('mIn').files;
        const json = [];

        if(mFiles.length === 0) return alert("Sube la música primero");

        for(let f of mFiles) {
            const base = f.name.split('.').slice(0, -1).join('.');
            const matchKey = cleanName(base);
            
            // Meter MP3
            zip.file(`mp3/${f.name}`, f);

            // Meter Imagen si existe (forzamos nombre igual al mp3 para evitar fallos en web)
            const imgFile = imgStore.get(matchKey);
            if(imgFile) {
                zip.file(`img/${base}.jpg`, imgFile);
            }

            json.push({
                t: base,
                a: "Variado",
                type: tag,
                file: `mp3/${f.name}`,
                img: `img/${base}.jpg`
            });
        }

        zip.file("datos.json", JSON.stringify(json, null, 4));
        const blob = await zip.generateAsync({type:"blob"});
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = "ACTUALIZACION_FINAL.zip";
        link.click();
    }
</script>
</body>
</html>
